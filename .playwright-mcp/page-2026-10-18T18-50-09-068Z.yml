              - text: The Labyrinth of Kindo'jan features its own Journey track of Renown and rewards, separate from the greater Delves Journey of the season. This reward track has nine ranks, each requiring 2100 Labyrinth Journey progress to reach (compared to the 4200 required for the Delves Journey); the weekly Delves turn-in quest—
