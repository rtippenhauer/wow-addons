                        - text: Corrosive Coin
                    - insertion [ref=e503]: s
                    - text: ", and"
                    - link [ref=e504] [cursor=pointer]:
                      - /url: https://www.wowhead.com/currency=2803/undercoin
                      - generic [ref=e505]:
                        - img "Undercoin" [ref=e506]
                        - text: Undercoin
                    - text: .Due to its super-sized nature, the Labyrinth of Kindo'jan features a super-sized number of Sturdy Chests to find, with 44 in total; 2-3 will be found in each Chamber, 5 in a hidden space, and the remaining 19 in rooms requiring Journey progress. Listed below are the locations of the 20 chests that have no additional requirements.
                    - link " Sturdy Chest Locations" [ref=e508] [cursor=pointer]:
                      - /url: "javascript:"
                    - link [ref=e510] [cursor=pointer]:
                      - /url: https://wow.zamimg.com/uploads/screenshots/normal/1304737.jpg
                      - img "Labyrinth of Kindo'jan mislaid treasure chest" [ref=e511]
                    - text: Apart from Sturdy Chests, you may randomly stumble upon
                    - link "Mislaid Treasure" [ref=e512] [cursor=pointer]:
                      - /url: https://www.wowhead.com/ptr-2/object=677408/mislaid-treasure
                    - text: chests in any Chamber you unlock. These feature the more traditional currency rewards shared with Sturdy Chests, along with a smaller amount of Journey progress. They can still contain various shared Delve cosmetics, however, as well as boons improving your stats for the duration of your run. Due to the extended time you can potentially stay in the Labyrinth, these boons can grow to substantial levels; don't ignore these chests just because their rewards are common!
                  - text:         
              - heading "Confronting Kindo'jan in Patch 12.1.5" [level=2] [ref=e513]
              - link [ref=e516] [cursor=pointer]:
                - /url: https://wow.zamimg.com/uploads/screenshots/normal/1304776.jpg
                - img "Labyrinth of Kindo'jan speaker's chamber door" [ref=e517]
              - text: The Labyrinth's namesake and ultimate goal of the Vilebranch's graverobbing efforts,
              - link "Kindo'jan" [ref=e518] [cursor=pointer]:
                - /url: https://www.wowhead.com/npc=266500/kindojan
              - text: ", the first Hash'ey of the Amani tribes, lies within the Speaker's Chamber at the top of Akil'zon's Roost. Those that wish to stop Den'Zara and the remaining Vilebranch from claiming his power must first unlock the door by completing all 9 chambers on at least Tier 8 in a single run. From there, it is simply a matter of defeating Den'Zara before she is able to bind the spirit to her will. Luckily, there is a waystone and a spectral Altar of Corrosion just past the door if you need to make any last-minute adjustments beforehand....However, it turns out Kindo'jan was plenty capable of handling things himself! Now, you are just another robber in his eyes, and must be punished."
              - heading "Fight Overview and Mechanics" [level=3] [ref=e519]
              - link [ref=e521] [cursor=pointer]:
                - /url: https://wow.zamimg.com/uploads/screenshots/normal/1304765.jpg
                - img "Kindo'jan Model" [ref=e522]
              - text: Battling against
              - link "Kindo'jan" [ref=e523] [cursor=pointer]:
                - /url: https://www.wowhead.com/npc=266500/kindojan
              - text: is largely a matter of patience, rather than one with a strict damage or healing check. Although he will eventually enrage after being in combat for over 10 minutes, your real concern in this fight is the
              - link "Disgraceful Display" [ref=e524] [cursor=pointer]:
                - /url: https://www.wowhead.com/spell=1303494/disgraceful-display
              - text: debuff. Whenever you are hit by an avoidable mechanic, you will gain one stack. Should you reach 3 stacks within 5 minutes, you will be instantly slain; no special treatment for tanks! Focus on properly handling the mechanics as they occur, and victory will eventually be yours.
              - generic [ref=e527]:
                - text: "Tip: try looting as many"
                - link "Mislaid Treasure" [ref=e528] [cursor=pointer]:
