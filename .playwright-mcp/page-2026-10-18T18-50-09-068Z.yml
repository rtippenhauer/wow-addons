                        - text: /
                        - link "Heroism" [ref=e1034] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=32182/heroism
                        - text: early and go for the burn. With the full boons + masks + this setup, the fight becomes much more manageable.
