                - img "A Gnawing Void of Curiosity" [ref=e402]
                - text: A Gnawing Void of Curiosity
              - text: —will provide 2000 Labyrinth Journey progress. Ultimately, you should be able to finish this Journey in only a few full runs of the Labyrinth if you take the time to explore.While most of its rewards are devoted to unlocking additional discoveries within the Labyrinth, they also include access to reusable glove enchants whose effects are active in any Delve.
