              - heading "Great Vault Rewards" [level=3] [ref=e663]
              - text: As the Labyrinth of Kindo'jan is a part of the Delves system of content, it is eligible for filling slots in your weekly Great Vault rewards. Due to its larger nature, every 3 chambers completed will count as one Delve completion of credit at whatever difficulty you have chosen. Defeating Kindo'jan will also provide another activity completion, for a total of 4 across a full run of the Labyrinth. This makes running the delve an excellent method for building up the vault of an alt!
