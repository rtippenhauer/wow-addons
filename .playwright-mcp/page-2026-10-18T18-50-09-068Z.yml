              - heading "Uncovering Secrets Within the Labyrinth of Kindo'jan in Patch 12.1.5" [level=2] [ref=e475]
              - text: A proper tomb has its share of treasures and hidden chambers, and the Labyrinth of Kindo'jan is no exception. While many of its secrets are gated behind progressing this delve's journey reward track, there is still plenty to discover for the curious, the keen-eyed, or possibly the foolhardy.
