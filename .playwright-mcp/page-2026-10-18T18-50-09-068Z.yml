                  - tabpanel [ref=e492]:
                    - link [ref=e494] [cursor=pointer]:
                      - /url: https://wow.zamimg.com/uploads/screenshots/normal/1304766.jpg
                      - img "Labyrinth of Kindo'jan sturdy chest" [ref=e495]
                    - text: A staple of every delve, Sturdy Chests can be looted a single time and contain static rewards. This can range from new decor and transmog items to entire Renown levels' worth of reputation with each of Midnight's factions, alongside a substantial bonus to your Delve and Labyrinth Journey progress. In addition, each chest will contain some
                    - link [ref=e496] [cursor=pointer]:
