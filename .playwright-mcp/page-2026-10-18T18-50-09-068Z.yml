              - text: in Tokka's Landing and meet with Valeera at the Labyrinth to get started. Your first run of the Labyrinth of Kindo'jan will be a tutorial experience to demonstrate how to traverse through its many chambers. Starting with
              - link [ref=e338] [cursor=pointer]:
