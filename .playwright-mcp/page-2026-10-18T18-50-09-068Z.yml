            - generic [ref=e243]:
              - generic: 
              - text: Introduced in Patch 12.1.5,
              - link "The Labyrinth of Kindo'jan" [ref=e244] [cursor=pointer]:
                - /url: https://www.wowhead.com/zone=16913/the-labyrinth-of-kindojan
              - text: is the first "Labyrinth-style" or "Megadelve." For those brave enough to enter this massive temple complex filled with chambers of traps, disturbed spirits, and other looters, the rewards are equally scaled up. In addition to always being bountiful to conveniently make use of
              - link [ref=e245] [cursor=pointer]:
                - /url: https://www.wowhead.com/currency=3028/restored-coffer-key
