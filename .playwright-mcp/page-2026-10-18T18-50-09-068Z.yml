              - text: s, which can be used to create Hero-track gear, and even offers a limited number of
              - link [ref=e252] [cursor=pointer]:
                - /url: https://www.wowhead.com/item=285065/mythical-soul-fragment
                - img "Mythical Soul Fragment" [ref=e253]
                - text: Mythical Soul Fragment
              - text: s to acquire Myth-track gear in whichever armor slot you like.Finally, no Labyrinth would be complete without its own Nemesis to fight, complete with a
