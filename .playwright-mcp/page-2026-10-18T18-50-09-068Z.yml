                - img "Dangers Untold and Hardships Unnumbered" [ref=e339]
                - text: Dangers Untold and Hardships Unnumbered
              - text: ", you will clear the initial Chamber of Rites at the Labyrinth's entrance, before being blocked by an impassable Spirit Gate. Luckily, the spirit of"
              - link "Kinduru" [ref=e340] [cursor=pointer]:
                - /url: https://www.wowhead.com/npc=273203/kinduru
              - text: ", Akil'zon's most recent speaker who was accidentally killed by Zul'jan when he claimed the Fang of Ula'tek, shows up to help. With his aid, access to the next two chambers is made available. After clearing them, you will be forced to end your run and return to Kul'amara. At this point, the full Labyrinth experience is unlocked Warband-wide."
              - heading "Running the Labyrinth of Kindo'jan in Patch 12.1.5" [level=2] [ref=e341]
              - text: At its core, the Labyrinth of Kindo'jan is effectively three delves combined together, with an optional endboss on its harder difficulties. What makes it different from a traditional delve is that you are allowed to select your route through its many chambers, each of which have a variety of objectives to complete. With every chamber cleared, your final rewards grow in size. In addition,
              - generic [ref=e343]:
                - text: those who are able to complete all 9 chambers on Tier 8 or higher will be able to challenge
                - link "Kindo'jan" [ref=e344] [cursor=pointer]:
                  - /url: https://www.wowhead.com/npc=266500/kindojan
              - text: ", the master of the Labyrinth, for further rewards."
              - generic [ref=e345]: While you can safely log out during a run, your progress in clearing each chamber is not saved between runs if you leave the delve. Make sure you have enough time to devote to a full clear if Kindo'jan is your ultimate goal.
