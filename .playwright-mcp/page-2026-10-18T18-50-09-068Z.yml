                    - text: — Combat — Your spells and abilities have a chance to transform you into a whirling tornado of venom for 15 seconds, dealing Nature damage to nearby enemies and granting damage reduction. At higher ranks, you will also leave a venomous trail behind for additional damage and even be able to pull far away enemies into the maelstorm, all while still being able to cast normally.
