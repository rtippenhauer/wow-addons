              - insertion [ref=e249]: s
              - text: ", your progress each run will determine how many can be redeemed at once, with a full clear providing triple the chests of a normal delve! Beyond that, the Labyrinth also provides"
              - link [ref=e250] [cursor=pointer]:
                - /url: https://www.wowhead.com/item=285801/heroic-soul-fragment
                - img "Heroic Soul Fragment" [ref=e251]
