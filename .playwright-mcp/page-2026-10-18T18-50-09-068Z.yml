                      - generic [ref=e1021]:
                        - text: Strongly recommend doing a full clear of every chamber and grabbing all the
                        - link "Mislaid Curiosities" [ref=e1022] [cursor=pointer]:
                          - /url: https://www.wowhead.com/object=584752/mislaid-curiosity
                        - text: / Treasures (
                        - link "Boon of Possibilities" [ref=e1023] [cursor=pointer]:
                          - /url: https://www.wowhead.com/item=267239/boon-of-possibilities
                        - text: and other Boons) plus all three Elemental Hexmasks before you pull
                        - link "Kindo’jan" [ref=e1024] [cursor=pointer]:
                          - /url: https://www.wowhead.com/npc=266500/kindojan
                        - text: . The boons stack up massively (health, primary stat, secondaries, speed, damage reduction, etc.) and the masks add free passive damage the whole fight—both stick with you into the boss room and make a huge difference.
                        - separator [ref=e1025]
                        - text: Recommended Corrosive Powers
                        - link "Ula’tek’s Gift" [ref=e1026] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=1291581/ulateks-gift
                        - text: +
                        - link "Insidious Venom" [ref=e1027] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=1303478/insidious-venom
                        - text: They synergize extremely well—Insidious Venom helps Ula’tek’s Gift ramp much faster.
                        - separator [ref=e1028]
                        - text: "Recommended Curios:Combat:"
                        - link "Corrosive Bilespear" [ref=e1029] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=1248875/corrosive-bilespear
                        - text: "Poison:"
                        - link "Bursting Toad Toxin" [ref=e1030] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=1298001/bursting-toad-toxin
                        - text: "Utility:"
                        - link "Soul-Cracking Dreamcatcher" [ref=e1031] [cursor=pointer]:
                          - /url: https://www.wowhead.com/spell=1296121/soul-cracking-dreamcatcher
                        - text: (this is the most important one)
                        - generic [ref=e1032]: Get the Dreamcatcher to Rank 5 if you can. It puts a 25% increased damage taken debuff on the boss (and nearby targets) whenever you interrupt/CC an elite.
                        - text: That amp is massive and lets you burn him down hard enough that you can often kill him before the first Rising Storm Wind / Akil’zon intermission even starts (or at least get him extremely low so Phase 2 is trivial).Valeera as DPS works great if you don’t need the extra healing (she’ll also help interrupt Amani Aegis). Pop
                        - link "Bloodlust" [ref=e1033] [cursor=pointer]:
